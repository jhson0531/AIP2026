data:
  input_csv: "data/raw/dataset_11.csv"
  text_col: "x"
  label_col: "label"
  year_col: "year"
  month_col: "month"
  freq_col_prefix: "tw_use_m"
  freq_col_count: 12
  collection_year: 2026
  collection_month: 5

preprocessing:
  label_values: [0, 1]
  missing_future_policy: "mask"
  active_threshold: 1
  eps: 1.0e-8

embedding:
  enabled: true
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  batch_size: 32
  normalize_embeddings: true
  cache_path: "data/features/embeddings.npy"

linguistic:
  enabled: true
  use_kiwi: true
  meme_template_patterns:
    - "특"
    - "하는 법"
    - "하는 중"
    - "그잡채"
    - "모먼트"
    - "각"
    - "충"
    - "좌"
    - "무새"

frequency:
  horizons: [1, 3, 6, 12]
  active_threshold: 1

split:
  split_type: "random"
  test_size: 0.15
  valid_size: 0.15
  random_state: 42
  stratify: true

models:
  run_models:
    - logistic_regression
    - random_forest
    - lightgbm
    - xgboost
    - catboost
    - mlp

training:
  random_state: 42
  n_jobs: -1
  early_stopping_rounds: 50

distillation:
  enabled: true
  teacher_model: "lightgbm"
  student_model: "mlp"
  alpha_values: [0.1, 0.3, 0.5, 0.7, 1.0]
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
